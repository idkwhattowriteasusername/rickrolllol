<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

    <video
        id="rickroll"
        src="./RickRoll.mp4"
        autoplay
        muted
        loop
        playsinline>
    </video>

    <script>
        const video = document.getElementById("rickroll");

        document.addEventListener("click", () => {
            video.muted = false;
            video.play();
        }, { once: true });

        document.addEventListener("touchstart", () => {
            video.muted = false;
            video.play();
        }, { once: true });
    </script>

</body>
</html>
