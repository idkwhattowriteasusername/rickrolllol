<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        /* საწყისი გვერდი */
        #startPage {
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
        }

        #enterButton {
            padding: 20px 40px;

            font-size: 24px;
            font-family: Arial, sans-serif;
            font-weight: bold;

            color: white;
            background: #222;

            border: 2px solid white;
            border-radius: 10px;

            cursor: pointer;

            transition: 0.2s;
        }

        #enterButton:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        /* ვიდეო */
        #rickroll {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            /* მთელი ვიდეო გამოჩნდება */
            object-fit: contain;

            /* შავი ფონი ცარიელი ადგილებისთვის */
            background: black;

            display: none;
        }
    </style>
</head>

<body>

    <!-- საწყისი გვერდი -->
    <div id="startPage">
        <button id="enterButton">
            დააჭირე საიტზე შესასვლელად
        </button>
    </div>

    <!-- Rickroll ვიდეო -->
    <video id="rickroll" loop playsinline>
        <source src="./RickRoll.mp4" type="video/mp4">
    </video>

    <script>
        const button = document.getElementById("enterButton");
        const startPage = document.getElementById("startPage");
        const video = document.getElementById("rickroll");

        button.addEventListener("click", async () => {

            // საწყისი გვერდის დამალვა
            startPage.style.display = "none";

            // ვიდეოს გამოჩენა
            video.style.display = "block";

            // ხმის ჩართვა
            video.muted = false;
            video.volume = 1;

            // ვიდეოს გაშვება
            try {
                await video.play();
            } catch (error) {
                console.log("Video could not start:", error);
            }
        });
    </script>

</body>
</html>
