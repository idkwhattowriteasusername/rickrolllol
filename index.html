<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #rickroll {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

    <video id="rickroll"
           autoplay
           loop
           playsinline>
        <source src="./RickRoll.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("rickroll");

        // Try to start WITH SOUND immediately
        video.muted = false;
        video.volume = 1;

        video.play().catch(() => {
            // Browser blocked autoplay with sound.
            // First interaction immediately enables it.
            const startWithSound = () => {
                video.muted = false;
                video.volume = 1;
                video.play();
            };

            document.addEventListener("click", startWithSound, { once: true });
            document.addEventListener("touchstart", startWithSound, { once: true });
        });
    </script>

</body>
</html>
